syntax = "proto3";

package financialadvisor.finance.v1;

option go_package = "financialAdvisor/services/core/internal/pb/finance/v1;financev1";

message Movement {
    string id = 1;
    string type = 2;
    double amount = 3;
    string category = 4;
    string description = 5;
}


message RegisterMovementRequest {
    string user_id = 1;
    Movement movement = 2;
}
message RegisterMovementResponse {
    Movement movement = 1;
}


service FinanceService {
  rpc RegisterMovement(RegisterMovementRequest) returns (RegisterMovementResponse);
}
